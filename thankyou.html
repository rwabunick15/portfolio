<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thank You — Nick Rwabuneza</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%236B4F2F'/><text x='50' y='68' font-size='55' font-family='Arial' font-weight='bold' fill='white' text-anchor='middle'>N</text></svg>" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --cream: #FDF8F3;
      --cream-2: #F5EDE0;
      --cream-3: #EDE0CE;
      --brown: #8B6F47;
      --brown-dark: #6B4F2F;
      --brown-light: #C4A882;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--cream);
      color: var(--brown-dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
    }

    .ty-card {
      background: var(--cream-2);
      border: 1.5px solid var(--cream-3);
      border-radius: 24px;
      padding: 60px 48px;
      max-width: 520px;
      width: 100%;
      box-shadow: 0 8px 40px rgba(107, 79, 47, 0.10);
    }

    .ty-icon {
      width: 80px;
      height: 80px;
      background: var(--brown-dark);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 28px;
    }

    .ty-icon i {
      font-size: 2rem;
      color: var(--cream);
    }

    .ty-card h1 {
      font-size: 2rem;
      font-weight: 800;
      color: var(--brown-dark);
      margin-bottom: 14px;
    }

    .ty-card p {
      font-size: 1rem;
      font-weight: 400;
      color: var(--brown);
      line-height: 1.7;
      margin-bottom: 36px;
    }

    .ty-card p span {
      font-weight: 600;
      color: var(--brown-dark);
    }

    .ty-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--brown-dark);
      color: var(--cream);
      text-decoration: none;
      padding: 14px 32px;
      border-radius: 50px;
      font-size: 0.95rem;
      font-weight: 600;
      font-family: 'Plus Jakarta Sans', sans-serif;
      transition: background 0.2s, transform 0.2s;
    }

    .ty-btn:hover {
      background: var(--brown);
      transform: translateY(-2px);
    }

    .ty-name {
      margin-top: 40px;
      font-size: 0.85rem;
      color: var(--brown-light);
      font-weight: 500;
    }

    @media (max-width: 520px) {
      .ty-card {
        padding: 40px 24px;
      }
      .ty-card h1 {
        font-size: 1.6rem;
      }
    }
  </style>
</head>
<body>

  <div class="ty-card">
    <div class="ty-icon">
      <i class="fas fa-check"></i>
    </div>

    <h1>Message Sent!</h1>

    <p>
      Thank you for reaching out. I have received your message and will
      get back to you as soon as possible — usually within
      <span>24 hours</span>.
    </p>

    <a href="index.html" class="ty-btn">
      <i class="fas fa-arrow-left"></i>
      Back to My Site
    </a>

    <p class="ty-name">— Nick Rwabuneza</p>
  </div>

</body>
</html>
